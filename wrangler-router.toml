name = "aei-relay-router"
main = "worker-router.js"
compatibility_date = "2024-01-01"

# ─────────────────────────────────────────────────────────────────────
# Variant B extends Variant A with:
#   • multi-host failover (query1 / query2)
#   • per-symbol rate budget (KV-backed when RELAY_KV bound)
#   • edge cache read-through
#
# To enable KV-backed budget (recommended for multi-isolate accuracy):
#   wrangler kv:namespace create RELAY_KV
#   → paste the returned id below, uncomment the block.
#
# Without KV, the budget is per-isolate and resets when the isolate recycles.
# ─────────────────────────────────────────────────────────────────────

# [[kv_namespaces]]
# binding = "RELAY_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true