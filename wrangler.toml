name = "aei-relay"
main = "worker.js"
compatibility_date = "2024-01-01"

# ─────────────────────────────────────────────────────────────────────
# PATCH-J: enable the shared-secret gate by setting RELAY_KEY:
#   wrangler secret put RELAY_KEY
# Then mirror the same value on Heroku:
#   heroku config:set RELAY_KEY=<same value>
# If neither is set, the gate is bypassed and behavior matches v1.0.
# ─────────────────────────────────────────────────────────────────────

[observability]
enabled = true

# Optional: restrict to a preferred deployment region (Cloudflare picks by latency otherwise)
# [placement]
# mode = "smart"